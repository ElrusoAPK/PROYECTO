<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Sísmico México</title>

<link rel="stylesheet" href="estilos.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>

<body>

<header>
    <h1>🌎 Dashboard Sísmico México</h1>
</header>

<div class="container">

    <div class="kpis">
        <div class="card"><h2 id="total">0</h2><p>Total</p></div>
        <div class="card"><h2 id="magProm">0</h2><p>Magnitud prom</p></div>
        <div class="card"><h2 id="profProm">0</h2><p>Profundidad prom</p></div>
        <div class="card"><h2 id="maxMag">0</h2><p>Magnitud max</p></div>
    </div>

    <div class="filters">
        <select id="selectAnio"></select>
        <select id="selectMag">
            <option value="">Magnitud</option>
            <option value="3">≥3</option>
            <option value="5">≥5</option>
            <option value="6">≥6</option>
            <option value="7">≥7</option>
        </select>
    </div>

    <canvas id="chartAnio"></canvas>

    <table>
        <thead>
            <tr>
                <th>Fecha</th>
                <th>Magnitud</th>
                <th>Profundidad</th>
            </tr>
        </thead>
        <tbody id="tabla"></tbody>
    </table>

</div>

<script src="dashboard.js"></script>

</body>
</html>
