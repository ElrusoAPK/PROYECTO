<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>USGS Style - Sismos México</title>

<link rel="stylesheet" href="estilos.css">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

    <h2>🌎 Sismos MX</h2>

    <div class="kpi">
        <span>Total</span>
        <h3 id="total">0</h3>
    </div>

    <div class="kpi">
        <span>Magnitud Prom</span>
        <h3 id="magProm">0</h3>
    </div>

    <div class="kpi">
        <span>Profundidad Prom</span>
        <h3 id="profProm">0</h3>
    </div>

    <hr>

    <label>Año inicio</label>
    <select id="anioInicio"></select>

    <label>Año fin</label>
    <select id="anioFin"></select>

    <button id="btnFiltrar">Aplicar filtro</button>

    <div class="spearman">
        <h4>Spearman</h4>
        <p id="spearman">-</p>
    </div>

</div>

<!-- MAPA -->
<div id="map"></div>

<!-- TABLA -->
<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>Fecha</th>
                <th>Mag</th>
                <th>Prof</th>
            </tr>
        </thead>
        <tbody id="tabla"></tbody>
    </table>
</div>

<script src="mapa.js"></script>

</body>
</html>
